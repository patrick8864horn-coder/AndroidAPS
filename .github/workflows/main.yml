name: Android CI

on:
  push:
    branches: [ "3.3.3.a+aisf3.1.0" ]
  pull_request:
    branches: [ "3.3.3.a+aisf3.1.0" ]
  workflow_dispatch:   # <-- manueller Start per Button möglich

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    # Keystore aus Base64 Secret decodieren
    - name: Decode Keystore
      run: |
        echo "$KEYSTORE_SET" | base64 -d > my-release-key.jks
      env:
        KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Release-APK bauen (signiert)
    - name: Build Release APK
      run: ./gradlew assembleRelease \
        -Pandroid.injected.signing.store.file=my-release-key.jks \
        -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
        -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
        -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    # APK direkt in Google Drive hochladen
    - name: Upload to Google Drive
  uses: gdrive-org/gdrive-upload-action@v2
   with:
  credentials_json: ${{ secrets.GDRIVE_JSON }}
  folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
  files: app/build/outputs/apk/release/*.apk
